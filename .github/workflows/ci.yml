# ============================================================================
# DFMIS Continuous Integration
#
# Runs every quality gate the project has. It is written to be correct when the
# repository is eventually pushed — nothing here runs today, because DFMIS is
# deliberately local-only for now.
#
# DESIGN PRINCIPLE: FAIL, NEVER SILENTLY SKIP.
#
# The HTTP suites need a running web server and a migrated database. This
# workflow starts both EXPLICITLY and waits for them. If either fails to come
# up, the job fails — it does not fall through to a green build having quietly
# run only the unit tests. tests/run_all.sh already exits non-zero when no
# server is reachable, and that behaviour is relied on here rather than worked
# around.
# ============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

# A newer push on the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }} — lint, analyse and test
    runs-on: ubuntu-latest

    strategy:
      # Both legs always run. A failure on the floor and a failure on the
      # current runtime are different findings, and cancelling one to report
      # the other would hide half the result.
      fail-fast: false
      matrix:
        # 8.5 is the runtime development and static analysis target.
        # 8.2 is the floor composer.json declares — and a declared floor that
        # nothing exercises is a guess, not a guarantee.
        #
        # PHP 8.2 leaves security support on 2026-12-31. When it does, raise
        # the floor here, in composer.json's require and in its platform pin
        # together; they are one decision expressed in three places.
        php: ['8.2', '8.5']

    services:
      # MariaDB rather than MySQL: migrations 002-004 are raw SQL written
      # against MariaDB. The PHP migrations (005, 006) are engine-agnostic by
      # design, but the baseline files are not.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: dfms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ci_root_password
      DB_NAME: dfms
      DB_CHARSET: utf8mb4
      APP_ENV: testing
      APP_ALLOWED_HOSTS: localhost,localhost:8000,127.0.0.1,127.0.0.1:8000
      DFMS_BASE_URL: http://localhost:8000

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # zip is required by Composer; the rest by the app. fileinfo backs
          # the upload MIME detection (finfo_open in includes/storage.php), so
          # a runner without it would fail at the first upload test rather
          # than at setup, which is a much harder failure to read.
          extensions: pdo_mysql, mbstring, zip, curl, json, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # ---- static checks: no server or database needed --------------------

      - name: Lint (php -l across every file)
        run: php tools/lint.php --quiet

      - name: Static analysis (PHPStan)
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # ---- database ---------------------------------------------------------

      - name: Wait for MariaDB
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -p"$DB_PASS" --silent 2>/dev/null; then
              echo "MariaDB is up"; exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready" >&2
          exit 1

      - name: Import baseline schema
        run: mysql -h 127.0.0.1 -u root -p"$DB_PASS" dfms < database.sql

      - name: Run migrations
        run: php database/migrate.php

      - name: Verify migrations are idempotent
        # A second run must be a no-op. If it applies anything, a migration is
        # not idempotent and would break a redeploy.
        run: |
          output=$(php database/migrate.php)
          echo "$output"
          echo "$output" | grep -q "Nothing to apply" || {
            echo "Migrations are not idempotent" >&2
            exit 1
          }

      - name: Seed demo and fixture data
        run: |
          php database/seed_admin.php
          php database/seed_demo_data.php

      - name: Create the isolated test database
        # PHPUnit and the Phase 3 animal suite both run against dfms_test,
        # never the schema the other HTTP suites use. --create also seeds it,
        # which is what makes an isolated HTTP run possible.
        run: php tools/test-db.php --create

      - name: Verify the test database is isolated
        # Asserts BOTH directions, which is what makes this a real check:
        # the guard must approve dfms_test and must REFUSE dfms.
        #
        # The earlier version of this step ran a single check and inherited the
        # job-level DB_NAME=dfms, so it asked the guard to approve the
        # DEVELOPMENT database and failed when the guard correctly refused —
        # the rail working as designed, reported as a broken build. DB_NAME is
        # now set per invocation instead of inherited.
        run: |
          set -e

          echo "--- the guard must APPROVE the test database ---"
          DB_NAME=dfms_test php -r '
            require "tests/bootstrap.php";
            [$safe, $reason] = dfms_test_database_is_safe();
            if (!$safe) { fwrite(STDERR, "FAIL: dfms_test was not approved: $reason\n"); exit(1); }
            echo "ok: $reason\n";
          '

          echo "--- the guard must REFUSE the development database ---"
          DB_NAME=dfms php -r '
            require "tests/bootstrap.php";
            [$safe, $reason] = dfms_test_database_is_safe();
            if ($safe) { fwrite(STDERR, "FAIL: the development database was approved as a test database: $reason\n"); exit(1); }
            echo "ok, correctly refused: $reason\n";
          '

          echo "--- and the two schemas must actually be distinct ---"
          test "$(mysql -h 127.0.0.1 -u root -p"$DB_PASS" -N -B -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='dfms_test'")" -gt 0

      # ---- unit tests: still no server needed ------------------------------

      - name: PHPUnit
        run: php vendor/bin/phpunit --colors=never

      # ---- integration: server started EXPLICITLY --------------------------

      - name: Start the application server
        run: |
          php -S localhost:8000 -t . > /tmp/dfms-server.log 2>&1 &
          echo $! > /tmp/dfms-server.pid
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8000/index.php; then
              echo "Server is up"; exit 0
            fi
            sleep 1
          done
          echo "Server failed to start:" >&2
          cat /tmp/dfms-server.log >&2
          exit 1

      - name: Start the isolated test server
        # Phase 3's animal suite mutates a lot of data, so it runs against
        # dfms_test on its own port. Started explicitly here for the same reason
        # as the server above: a suite that cannot run must FAIL, not skip.
        run: |
          DB_NAME=dfms_test php -S localhost:8100 -t . > /tmp/dfms-test-server.log 2>&1 &
          echo $! > /tmp/dfms-test-server.pid
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8100/index.php; then
              echo "Isolated test server is up"; exit 0
            fi
            sleep 1
          done
          echo "Isolated test server failed to start:" >&2
          cat /tmp/dfms-test-server.log >&2
          exit 1

      - name: Full test suite
        env:
          # run_all.sh reuses the isolated server started above rather than
          # spawning a second one.
          DFMS_ANIMAL_PORT: "8100"
        # Runs lint, all three unit suites and all five HTTP suites, and exits
        # non-zero if a required server is unreachable rather than skipping.
        run: bash tests/run_all.sh

      - name: Server logs on failure
        if: failure()
        run: |
          echo "--- application server ---"
          cat /tmp/dfms-server.log || true
          echo "--- isolated test server ---"
          cat /tmp/dfms-test-server.log || true

      - name: Stop the servers
        if: always()
        run: |
          kill "$(cat /tmp/dfms-server.pid)" 2>/dev/null || true
          kill "$(cat /tmp/dfms-test-server.pid)" 2>/dev/null || true
